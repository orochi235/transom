# yaml-language-server: $schema=./menubar.schema.json
#
# The wall's menu bar widget. `perch install` from this directory builds it and
# hands it to launchd; `perch run` puts it in the foreground to look at.
#
# It reports, it opens things, and it runs the wall. An action is a subprocess
# perch waits on, so it cannot hold a server open — `transom` hands the lifetime to
# launchd and returns, which is why these items are `run` and not a dev script.
# `transom` is on PATH because `transom install` links it into ~/.local/bin, which is
# already in the PATH this agent runs with.

app:
  name: transom
  id: tech.michaelbaker.transom.menubar
  icon: rectangle.stack
  interval: 5s
  sign: perch local signing

watch:
  # launchd's side of `transom stat`: whether the two agents are installed, loaded
  # and up. The daemon answering HTTP is a different question, and the gap
  # between the two is the state worth naming.
  daemon:
    launchagent: tech.michaelbaker.transom.daemon
  client:
    launchagent: tech.michaelbaker.transom.client
  # Homebrew's one service, which stands in for both: `brew services` owns it
  # and its daemon serves the page.
  service:
    launchagent: tech.michaelbaker.transom
  # The paths come from the daemon rather than this file, which is what keeps
  # a home directory out of a committed config.
  wall:
    http: http://localhost:8787/api/health
    json: true
    shape:
      ok: bool
      items: int
      ttlMs: int
      inbox: string
      trash: string
  zones:
    http: http://localhost:8787/api/zones
    json: true
    shape:
      zones: [{zone: string, items: int, path: string, icon: string}]

# Ordered, so each state excludes the ones above it: `wedged` is a daemon
# launchd has started that is not answering, which is the case `!wall.ok` alone
# used to report as "not running".
state:
  - uninstalled: "!daemon.installed && !service.installed"
  - stopped: "!daemon.loaded && !service.loaded"
  - wedged: "!wall.ok"
  - up:

status:
  - when: "uninstalled || stopped || wedged"
    icon: exclamationmark.triangle
  - when: "wall.data.items == 0"
    dim: true
  - badge: "wall.data.items"

menu:
  - text: "{{wall.data.items}} on the wall"
    icon: photo.stack
    when: up
  - text: "daemon loaded, not answering"
    icon: exclamationmark.triangle
    when: wedged
  - text: "daemon not loaded"
    icon: pause.circle
    when: stopped
  - text: "not installed — run transom install"
    icon: shippingbox
    when: uninstalled
  - text: "client not loaded"
    icon: display.trianglebadge.exclamationmark
    when: "daemon.installed && !client.loaded"
  - separator
  - text: Man the wall
    icon: macwindow
    open: http://localhost:7750
  - separator
  - each: zones.data.zones
    when: "zones.ok"
    text: "{{it.zone}} — {{it.items}}"
    # The sfkey in the zone's project's .hued. Most projects do not set one,
    # and an empty name draws no icon.
    icon: "{{it.icon}}"
    open: "{{it.path}}"
  - separator
  - text: Undo last expiry
    icon: arrow.uturn.backward
    when: "wall.ok"
    post: {url: "http://localhost:8787/api/undo"}
  - text: Open the inbox
    icon: tray
    when: "wall.ok"
    open: "{{wall.data.inbox}}"
  - text: Open the trash
    icon: trash
    when: "wall.ok"
    open: "{{wall.data.trash}}"
  - separator
  # up, down and cycle each act on both agents, so they stay wall's job. The
  # daemon on its own gets the verb that boots out, waits and bootstraps —
  # which `transom cycle` cannot do, since kickstart needs the job already loaded.
  - text: Restart the daemon
    icon: arrow.clockwise
    when: daemon.installed
    agent: daemon.restart
  - text: Cycle the wall
    icon: arrow.triangle.2.circlepath
    when: "up || wedged"
    run: [transom, cycle]
  - text: Start the wall
    icon: play
    when: stopped
    run: [transom, up]
  - text: Stop the wall
    icon: stop
    when: "up || wedged"
    run: [transom, down]
  - separator
  - {text: Quit, icon: power, quit: true}
